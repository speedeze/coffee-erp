# fly.toml app configuration file generated for coffee-erp on 2026-11-01T18:18:32Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'coffee-erp'
primary_region = 'ams'

[build]

[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  force_https = true
  internal_port = 8000
  min_machines_running = 0
  processes = [ "app" ]

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
