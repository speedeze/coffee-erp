{% extends "base.html" %}

{% block title %}حسابات الخزائن والبنوك الجارية{% endblock %}

{% block content %}
<div x-data="{
    accounts: [],
    glAccounts: [],
    loading: true,

    modal: {
        show: false,
        code: 'TREAS-' + Math.floor(10 + Math.random() * 90),
        name: '',
        name_ar: '',
        account_type: 'CASH',
        currency: 'USD',
        gl_account_id: '',
        saving: false
    },

    async initData() {
        this.loading = true;
        try {
            const [accRes, glRes] = await Promise.all([
                fetch('/treasury/api/accounts'),
                fetch('/accounting/api/accounts')
            ]);
            if (accRes.ok) this.accounts = await accRes.json();
            if (glRes.ok) this.glAccounts = await glRes.json();
        } catch (e) {
            console.error(e);
        } finally {
            this.loading = false;
        }
    },

    openCreate() {
        this.modal = {
            show: true,
            code: 'TREAS-' + Math.floor(10 + Math.random() * 90),
            name: '',
            name_ar: '',
            account_type: 'CASH',
            currency: 'USD',
            gl_account_id: this.glAccounts.length > 0 ? this.glAccounts[0].id : '',
            saving: false
        };
    },

    async createAccount() {
        if (!this.modal.name_ar || !this.modal.gl_account_id) {
            showToast('يرجى إدخال اسم الخزينة واختيار الحساب المرتبط', 'error');
            return;
        }
        this.modal.saving = true;
        try {
            const res = await fetch('/treasury/api/accounts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(this.modal)
            });
            const data = await res.json();
            if (res.ok) {
                showToast(`تمت إضافة ${data.name_ar} بنجاح`);
                this.modal.show = false;
                this.initData();
            } else {
                showToast(data.detail || 'حدث خطأ أثناء الإضافة', 'error');
            }
        } catch (e) {
            showToast('خطأ بالاتصال بالخادم', 'error');
        } finally {
            this.modal.saving = false;
        }
    }
}" x-init="initData()">

    <!-- Odoo Control Panel -->
    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm mb-4">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">
            <div>
                <nav class="flex items-center space-x-reverse space-x-1.5 text-xs text-slate-500 mb-1">
                    <a href="/dashboard" class="hover:text-odoo-purple transition">الرئيسية</a>
                    <span>/</span>
                    <span class="text-slate-400">الخزائن والبنوك</span>
                    <span>/</span>
                    <span class="text-odoo-purple font-bold">الحسابات والخزائن النقدية</span>
                </nav>
                <div class="flex items-center space-x-reverse space-x-2">
                    <h1 class="text-xl font-bold text-slate-900">إدارة الخزائن النقدية والحسابات البنكية الجارية</h1>
                    <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-amber-100 text-amber-900 font-mono" x-text="accounts.length + ' حساب'"></span>
                </div>
            </div>

            <button @click="openCreate()" class="odoo-btn-primary px-3.5 py-2 rounded-lg text-xs font-bold shadow-sm transition flex items-center">
                <i class="fa-solid fa-plus ml-1.5"></i>
                <span>خزينة / بنك جديد</span>
            </button>
        </div>
    </div>

    <!-- Accounts Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="a in accounts" :key="a.id">
            <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <span class="font-mono text-xs font-bold text-odoo-purple" x-text="a.code"></span>
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold"
                              :class="a.account_type === 'BANK' ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800'"
                              x-text="a.account_type === 'BANK' ? 'حساب بنكي' : 'صندوق خزينة'"></span>
                    </div>

                    <h3 class="font-bold text-base text-slate-900 mb-0.5" x-text="a.name_ar"></h3>
                    <p class="font-mono text-xs text-slate-400 mb-3" x-text="a.name"></p>

                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 text-xs font-mono space-y-1">
                        <div class="flex justify-between">
                            <span class="font-sans text-slate-500">حساب الأستاذ المرتبط:</span>
                            <span class="font-bold text-odoo-purple" x-text="a.gl_account ? a.gl_account.code + ' (' + a.gl_account.name_ar + ')' : '#1110'"></span>
                        </div>
                        <div class="flex justify-between">
                            <span class="font-sans text-slate-500">عملة الحساب:</span>
                            <span class="font-bold text-slate-900" x-text="a.currency"></span>
                        </div>
                    </div>
                </div>

                <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
                    <span class="text-emerald-600 font-bold flex items-center">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 ml-1"></span>
                        نشط وجاهز للعمليات
                    </span>
                    <a href="/treasury/receipts" class="text-odoo-purple hover:underline font-bold text-[11px]">
                        سندات الحساب
                    </a>
                </div>
            </div>
        </template>
    </div>

    <!-- Create Modal -->
    <div x-cloak x-show="modal.show" class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl border border-slate-200 overflow-hidden text-right" @click.outside="modal.show = false">
            <div class="bg-odoo-purple text-white px-6 py-4 flex items-center justify-between">
                <h3 class="font-bold text-base">إضافة خزينة أو حساب بنكي جديد</h3>
                <button @click="modal.show = false" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form @submit.prevent="createAccount()" class="p-6 space-y-4 text-xs text-slate-800">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">كود الحساب:</label>
                        <input type="text" x-model="modal.code" required class="w-full p-2 border border-slate-300 rounded-lg font-mono">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">نوع الحساب:</label>
                        <select x-model="modal.account_type" class="w-full p-2 border border-slate-300 rounded-lg bg-white">
                            <option value="CASH">خزينة / صندوق نقدية</option>
                            <option value="BANK">حساب بنكي جاري</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-slate-700 mb-1">اسم الخزينة / البنك (عربي):</label>
                    <input type="text" x-model="modal.name_ar" placeholder="مثال: الخزينة الفرعية للمصنع" required class="w-full p-2 border border-slate-300 rounded-lg">
                </div>

                <div>
                    <label class="block font-bold text-slate-700 mb-1">الاسم بالإنجليزية:</label>
                    <input type="text" x-model="modal.name" placeholder="Factory Cash Drawer" class="w-full p-2 border border-slate-300 rounded-lg font-mono">
                </div>

                <div>
                    <label class="block font-bold text-slate-700 mb-1">الحساب المالي المرتبط بدليل الحسابات (GL Account):</label>
                    <select x-model="modal.gl_account_id" required class="w-full p-2 border border-slate-300 rounded-lg bg-white font-bold">
                        <template x-for="acc in glAccounts" :key="acc.id">
                            <option :value="acc.id" x-text="acc.code + ' - ' + acc.name_ar"></option>
                        </template>
                    </select>
                </div>

                <div class="pt-3 border-t border-slate-200 flex justify-between">
                    <button type="button" @click="modal.show = false" class="px-4 py-2 border border-slate-300 rounded-lg font-bold">إلغاء</button>
                    <button type="submit" :disabled="modal.saving" class="px-5 py-2 odoo-btn-primary font-bold rounded-lg shadow">حفظ الحساب</button>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
