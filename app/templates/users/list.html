{% extends "base.html" %}

{% block title %}فريق المحاسبين والصلاحيات{% endblock %}

{% block content %}
<div x-data="{
    users: [],
    loading: true,

    modal: {
        show: false,
        username: '',
        full_name: '',
        full_name_ar: '',
        email: '',
        password: '',
        role: 'INVENTORY_ACCOUNTANT',
        saving: false
    },

    async loadUsers() {
        this.loading = true;
        try {
            const res = await fetch('/users/api/list');
            if (res.ok) this.users = await res.json();
        } catch (e) {
            console.error(e);
        } finally {
            this.loading = false;
        }
    },

    openCreate() {
        this.modal = {
            show: true,
            username: '',
            full_name: '',
            full_name_ar: '',
            email: '',
            password: '',
            role: 'INVENTORY_ACCOUNTANT',
            saving: false
        };
    },

    async createUser() {
        if (!this.modal.username || !this.modal.password || !this.modal.full_name_ar) {
            showToast('يرجى استكمال جميع الحقول المطلوبة', 'error');
            return;
        }
        this.modal.saving = true;
        try {
            const res = await fetch('/users/api/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(this.modal)
            });
            const data = await res.json();
            if (res.ok) {
                showToast(`تم إنشاء حساب ${data.full_name_ar} بنجاح`);
                this.modal.show = false;
                this.loadUsers();
            } else {
                showToast(data.detail || 'حدث خطأ أثناء إنشاء المستخدم', 'error');
            }
        } catch (e) {
            showToast('خطأ بالاتصال بالخادم', 'error');
        } finally {
            this.modal.saving = false;
        }
    },

    async toggleUserStatus(u) {
        try {
            const res = await fetch('/users/api/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: u.id,
                    role: u.role,
                    is_active: !u.is_active
                })
            });
            if (res.ok) {
                showToast(`تم تحديث حالة المستخدم ${u.full_name_ar}`);
                this.loadUsers();
            }
        } catch (e) {
            showToast('خطأ بالاتصال بالخادم', 'error');
        }
    }
}" x-init="loadUsers()">

    <!-- Odoo Control Panel -->
    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm mb-4">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">
            <div>
                <nav class="flex items-center space-x-reverse space-x-1.5 text-xs text-slate-500 mb-1">
                    <a href="/dashboard" class="hover:text-odoo-purple transition">الرئيسية</a>
                    <span>/</span>
                    <span class="text-slate-400">الإعدادات</span>
                    <span>/</span>
                    <span class="text-odoo-purple font-bold">فريق المحاسبين والصلاحيات</span>
                </nav>
                <div class="flex items-center space-x-reverse space-x-2">
                    <h1 class="text-xl font-bold text-slate-900">إدارة فريق المحاسبين الأربعة وصلاحيات الدخول (RBAC)</h1>
                </div>
            </div>

            <button @click="openCreate()" class="odoo-btn-primary px-3.5 py-2 rounded-lg text-xs font-bold shadow-sm transition flex items-center">
                <i class="fa-solid fa-user-plus ml-1.5"></i>
                <span>إضافة محاسب جديد</span>
            </button>
        </div>
    </div>

    <!-- Users Cards Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <template x-for="u in users" :key="u.id">
            <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <div class="w-10 h-10 rounded-full bg-odoo-purple text-white flex items-center justify-center font-bold text-sm shadow">
                            <span x-text="u.username.substring(0, 2).toUpperCase()"></span>
                        </div>
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold"
                              :class="u.is_active ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-500'"
                              x-text="u.is_active ? 'نشط' : 'معطل'"></span>
                    </div>

                    <h3 class="font-bold text-slate-900 text-sm" x-text="u.full_name_ar"></h3>
                    <p class="font-mono text-xs text-slate-500 mb-2" x-text="u.full_name"></p>
                    <div class="text-[11px] font-mono text-slate-400 mb-3" x-text="u.email"></div>

                    <div class="border-t border-slate-100 pt-3">
                        <span class="text-[10px] text-slate-400 block font-bold mb-1">المسمى الوظيفي والدور:</span>
                        <span class="px-2.5 py-1 rounded-lg text-xs font-bold block text-center"
                              :class="{
                                  'bg-purple-100 text-purple-900 border border-purple-200': u.role === 'CHIEF_ACCOUNTANT',
                                  'bg-amber-100 text-amber-900 border border-amber-200': u.role === 'INVENTORY_ACCOUNTANT',
                                  'bg-cyan-100 text-cyan-900 border border-cyan-200': u.role === 'PURCHASES_ACCOUNTANT',
                                  'bg-emerald-100 text-emerald-900 border border-emerald-200': u.role === 'SALES_ACCOUNTANT'
                              }"
                              x-text="{
                                  'CHIEF_ACCOUNTANT': 'رئيس الحسابات والمدير المالي',
                                  'INVENTORY_ACCOUNTANT': 'محاسب التكاليف والمخازن',
                                  'PURCHASES_ACCOUNTANT': 'محاسب المشتريات والموردين',
                                  'SALES_ACCOUNTANT': 'محاسب المبيعات والعملاء'
                              }[u.role] || u.role"></span>
                    </div>
                </div>

                <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
                    <span class="font-mono text-slate-400" x-text="'@' + u.username"></span>
                    <button @click="toggleUserStatus(u)" class="text-slate-500 hover:text-odoo-purple font-bold">
                        <span x-text="u.is_active ? 'تعطيل الحساب' : 'تفعيل الحساب'"></span>
                    </button>
                </div>
            </div>
        </template>
    </div>

    <!-- Create User Modal -->
    <div x-cloak x-show="modal.show" class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl border border-slate-200 overflow-hidden text-right" @click.outside="modal.show = false">
            <div class="bg-odoo-purple text-white px-6 py-4 flex items-center justify-between">
                <h3 class="font-bold text-base">إضافة مستخدم / محاسب جديد</h3>
                <button @click="modal.show = false" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form @submit.prevent="createUser()" class="p-6 space-y-4 text-xs text-slate-800">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">اسم المستخدم (Username):</label>
                    <input type="text" x-model="modal.username" required class="w-full p-2 border border-slate-300 rounded-lg font-mono">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">الاسم الكامل بالعربية:</label>
                    <input type="text" x-model="modal.full_name_ar" placeholder="مثال: يوسف إبراهيم" required class="w-full p-2 border border-slate-300 rounded-lg">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">الاسم بالإنجليزية:</label>
                    <input type="text" x-model="modal.full_name" placeholder="Youssef Ibrahim" required class="w-full p-2 border border-slate-300 rounded-lg font-mono">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">البريد الإلكتروني:</label>
                    <input type="email" x-model="modal.email" placeholder="user@coffeeroast.local" required class="w-full p-2 border border-slate-300 rounded-lg font-mono">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">كلمة المرور:</label>
                    <input type="password" x-model="modal.password" required class="w-full p-2 border border-slate-300 rounded-lg font-mono">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">الدور والصلاحية (Role):</label>
                    <select x-model="modal.role" class="w-full p-2 border border-slate-300 rounded-lg bg-white font-bold">
                        <option value="CHIEF_ACCOUNTANT">رئيس الحسابات (Chief Accountant)</option>
                        <option value="INVENTORY_ACCOUNTANT">محاسب التكاليف والمخازن (Inventory Accountant)</option>
                        <option value="PURCHASES_ACCOUNTANT">محاسب المشتريات (Purchases Accountant)</option>
                        <option value="SALES_ACCOUNTANT">محاسب المبيعات (Sales Accountant)</option>
                    </select>
                </div>
                <div class="pt-3 border-t border-slate-200 flex justify-between">
                    <button type="button" @click="modal.show = false" class="px-4 py-2 border border-slate-300 rounded-lg font-bold">إلغاء</button>
                    <button type="submit" :disabled="modal.saving" class="px-5 py-2 odoo-btn-primary font-bold rounded-lg shadow">إنشاء الحساب</button>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
