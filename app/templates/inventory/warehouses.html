{% extends "base.html" %}

{% block title %}المستودعات الخمسة وتقييم المخزون{% endblock %}

{% block content %}
<div x-data="{
    warehouses: [],
    loading: true,
    selectedWh: null,

    // Adjust modal state
    adjustModal: {
        show: false,
        warehouse_id: '',
        item_id: '',
        new_quantity: 0,
        reason: 'جرد دوري فصلي',
        saving: false
    },

    async loadWarehouses() {
        this.loading = true;
        try {
            const res = await fetch('/inventory/api/warehouses');
            if (res.ok) this.warehouses = await res.json();
        } catch (e) {
            console.error(e);
        } finally {
            this.loading = false;
        }
    },

    openAdjust(wh, item) {
        this.adjustModal = {
            show: true,
            warehouse_id: wh.id,
            item_id: item.item_id,
            new_quantity: item.quantity,
            reason: 'مطابقة الجرد الفعلي للمستودع',
            saving: false
        };
    },

    async submitAdjust() {
        this.adjustModal.saving = true;
        try {
            const res = await fetch('/inventory/api/adjust', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(this.adjustModal)
            });
            const data = await res.json();
            if (res.ok) {
                showToast(data.message || 'تمت التسوية بنجاح');
                this.adjustModal.show = false;
                this.loadWarehouses();
            } else {
                showToast(data.detail || 'فشلت التسوية', 'error');
            }
        } catch (e) {
            showToast('خطأ بالاتصال بالخادم', 'error');
        } finally {
            this.adjustModal.saving = false;
        }
    }
}" x-init="loadWarehouses()">

    <!-- Odoo Control Panel -->
    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm mb-4">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">
            <div>
                <nav class="flex items-center space-x-reverse space-x-1.5 text-xs text-slate-500 mb-1">
                    <a href="/dashboard" class="hover:text-odoo-purple transition">الرئيسية</a>
                    <span>/</span>
                    <span class="text-slate-400">المخازن</span>
                    <span>/</span>
                    <span class="text-odoo-purple font-bold">المستودعات وتقييم الأرصدة</span>
                </nav>
                <div class="flex items-center space-x-reverse space-x-2">
                    <h1 class="text-xl font-bold text-slate-900">هيكلية المستودعات الخمسة المتخصصة</h1>
                    <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-purple-100 text-odoo-purple">
                        5 Warehouses
                    </span>
                </div>
            </div>

            <div class="flex items-center space-x-reverse space-x-2">
                <a href="/inventory/stock-moves" class="px-3 py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-lg text-xs shadow-sm transition">
                    <i class="fa-solid fa-dolly ml-1.5"></i> سجل حركات المخزون
                </a>
                <button @click="loadWarehouses()" class="p-2 border border-slate-300 rounded-lg hover:bg-slate-100 text-slate-600 transition">
                    <i class="fa-solid fa-arrows-rotate" :class="loading ? 'fa-spin' : ''"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 5 Dedicated Warehouses Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
        <template x-for="wh in warehouses" :key="wh.id">
            <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <span class="px-2.5 py-1 rounded-md font-mono text-xs font-extrabold bg-purple-100 text-odoo-purple" x-text="wh.code"></span>
                        <span class="text-xs font-mono font-bold text-slate-400" x-text="wh.total_items_count + ' صنف مخزن'"></span>
                    </div>

                    <h3 class="font-extrabold text-base text-slate-900" x-text="wh.name_ar"></h3>
                    <p class="font-mono text-xs text-slate-400 mb-3" x-text="wh.name"></p>

                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 font-mono space-y-1 text-xs">
                        <div class="flex justify-between items-center">
                            <span class="font-sans text-slate-500 font-bold">الحساب المرتبط بدليل الحسابات:</span>
                            <span class="text-odoo-purple font-bold" x-text="wh.account ? wh.account.code + ' (' + wh.account.name_ar + ')' : '#1300'"></span>
                        </div>
                        <div class="flex justify-between items-center pt-1 border-t border-slate-200 text-sm font-extrabold text-slate-900">
                            <span class="font-sans text-xs text-slate-700">القيمة الإجمالية للمخزون:</span>
                            <span class="text-emerald-700" x-text="'$' + (wh.valuation || 0).toLocaleString('en-US', {minimumFractionDigits: 2})"></span>
                        </div>
                    </div>
                </div>

                <!-- Warehouse Items Preview Table -->
                <div class="mt-4 border-t border-slate-100 pt-3">
                    <div class="text-[11px] font-bold text-slate-500 mb-2">الأصناف الحالية المتوفرة بالمستودع:</div>
                    <div class="max-h-36 overflow-y-auto space-y-1.5 text-xs font-mono">
                        <template x-if="wh.quants.length === 0">
                            <div class="text-slate-400 text-[11px] font-sans py-2 text-center">لا توجد أرصدة حالية في هذا المستودع</div>
                        </template>
                        <template x-for="q in wh.quants" :key="q.id">
                            <div class="flex items-center justify-between p-1.5 bg-slate-50 rounded hover:bg-purple-50 transition">
                                <div>
                                    <span class="font-bold font-sans text-slate-800" x-text="q.item ? q.item.name_ar : '-'"></span>
                                    <span class="text-[10px] text-slate-400 block" x-text="q.item ? q.item.sku : ''"></span>
                                </div>
                                <div class="flex items-center space-x-reverse space-x-2">
                                    <span class="font-extrabold text-slate-900" x-text="q.quantity + ' ' + (q.item && q.item.uom ? q.item.uom.code : '')"></span>
                                    <button @click="openAdjust(wh, q)" class="p-1 text-slate-400 hover:text-odoo-purple" title="تسوية جردية">
                                        <i class="fa-solid fa-sliders text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- Stock Adjust Modal -->
    <div x-cloak x-show="adjustModal.show" 
         class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl border border-slate-200 overflow-hidden text-right"
             @click.outside="adjustModal.show = false">
            <div class="bg-odoo-purple text-white px-6 py-4 flex items-center justify-between">
                <h3 class="font-bold text-base">تسوية جردية للمخزون</h3>
                <button @click="adjustModal.show = false" class="text-white/80 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form @submit.prevent="submitAdjust()" class="p-6 space-y-4 text-xs text-slate-800">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">الكمية الفعلية الجديدة بعد الجرد:</label>
                    <input type="number" step="0.01" min="0" x-model="adjustModal.new_quantity" required
                           class="w-full p-2 border border-slate-300 rounded-lg font-mono text-center font-bold text-base text-odoo-purple">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">سبب التسوية الجردية:</label>
                    <input type="text" x-model="adjustModal.reason" required
                           class="w-full p-2 border border-slate-300 rounded-lg">
                </div>
                <div class="pt-3 border-t border-slate-200 flex justify-between">
                    <button type="button" @click="adjustModal.show = false" class="px-4 py-2 border border-slate-300 rounded-lg font-bold">إلغاء</button>
                    <button type="submit" :disabled="adjustModal.saving" class="px-5 py-2 odoo-btn-primary font-bold rounded-lg shadow">
                        تأكيد التسوية
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
