version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: coffee_erp_postgres
    restart: always
    environment:
      POSTGRES_USER: coffee_user
      POSTGRES_PASSWORD: coffee_secure_password_2026
      POSTGRES_DB: coffee_erp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee_user -d coffee_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coffee_erp_monolith
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROJECT_NAME: "CoffeeRoast ERP Monolith"
      DATABASE_URL: "postgresql+psycopg2://coffee_user:coffee_secure_password_2026@db:5432/coffee_erp"
      SECRET_KEY: "coffee-erp-production-secret-key-super-secure"
      ENVIRONMENT: "production"
      HOST: "0.0.0.0"
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
    driver: local
